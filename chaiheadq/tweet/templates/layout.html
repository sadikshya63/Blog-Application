{% load static %}

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Chai aur Django
        {% endblock title %}
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- Custom CSS -->
    <style>

        body {
            background: #101418;
            color: #f1f3f5;
            min-height: 100vh;
        }

        /* NAVBAR */

        .custom-navbar {
            background: #171b21;
            border-bottom: 1px solid #2b3138;
            padding: 14px 0;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff !important;
            letter-spacing: -0.5px;
        }

        .navbar-brand span {
            color: #0d6efd;
        }

        /* SEARCH */

        .search-box {
            width: 280px;
        }

        .search-box input {
            background: #20252b;
            border: 1px solid #343a40;
            color: white;
            border-radius: 10px;
        }

        .search-box input:focus {
            background: #20252b;
            color: white;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.2);
        }

        .search-box input::placeholder {
            color: #8b949e;
        }

        /* NAV LINKS */

        .nav-link-custom {
            color: #adb5bd;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .nav-link-custom:hover {
            color: white;
            background: #252b32;
        }

        /* MAIN CONTENT */

        .main-container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px;
        }

        /* BUTTONS */

        .btn {
            border-radius: 8px;
        }

        .create-btn {
            padding: 10px 18px;
            font-weight: 600;
        }

        /* FOOTER */

        footer {
            color: #6c757d;
            text-align: center;
            padding: 30px 0;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .search-box {
                width: 100%;
                margin: 12px 0;
            }

            .main-container {
                padding: 25px 15px;
            }
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg custom-navbar">

        <div class="container">

            <!-- BRAND -->

            <a class="navbar-brand" href="{% url 'tweet_list' %}">
                Chai<span>Code</span>
            </a>

            <!-- MOBILE TOGGLE -->

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- NAVIGATION -->

            <div class="collapse navbar-collapse" id="navbarContent">

                <!-- SEARCH -->

                <form class="d-flex search-box ms-lg-4" method="GET" action="{% url 'tweet_list' %}" role="search">

                    <input
                        class="form-control me-2"
                        type="search"
                        name="q"
                        value="{{request.GET.q}}"
                        placeholder="Search tweets..."
                        aria-label="Search">

                    <button
                        class="btn btn-outline-primary"
                        type="submit">
                        Search
                    </button>

                </form>

                <!-- RIGHT SIDE -->

                <div class="ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">

                    <a class="nav-link-custom"
                       href="{% url 'tweet_list' %}">
                        Tweets
                    </a>

                    {% if user.is_authenticated %}

                    <a class="btn btn-primary"
                       href="{% url 'tweet_create' %}">
                        + Create Tweet
                    </a>

                    <form method="post"
                          action="{% url 'logout' %}"
                          class="m-0">

                        {% csrf_token %}

                        <button
                            class="btn btn-outline-danger"
                            type="submit">
                            Logout
                        </button>

                    </form>

                    {% else %}

                    <a class="nav-link-custom"
                       href="{% url 'register' %}">
                        Register
                    </a>

                    <a class="btn btn-primary"
                       href="{% url 'login' %}">
                        Login
                    </a>

                    {% endif %}

                </div>

            </div>

        </div>

    </nav>


    <!-- MAIN CONTENT -->

    <main class="main-container">

        {% block content %}

        {% endblock content %}

    </main>


    <!-- FOOTER -->

    <footer>
        <small>ChaiCode • Share your thoughts ☕</small>
    </footer>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
